name: Build BLE Meter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack native project
        run: |
          rm -rf native-build
          mkdir native-build
          unzip -q android-native-project.zip -d native-build

      - name: Build installable APK
        working-directory: native-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp native-build/app/build/outputs/apk/debug/app-debug.apk BLE_Meter_Native_1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLE_Meter_Native_APK
          path: BLE_Meter_Native_1.0.apk
          if-no-files-found: error
